<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #fff;
    --glass: rgba(20, 20, 30, 0.45);
    --border: rgba(255, 255, 255, 0.85);
    --green-1: #0f9b4a;
    --green-2: #2fd96b;
    --green-3: #b6ff6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1b1b24;
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }

  /* Two stacked layers so wallpapers crossfade */
  .bg {
    position: fixed; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .bg.show { opacity: 1; }
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,0.18); }

  main {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }

  .modes { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .mode {
    font: inherit; font-size: 18px; font-weight: 600;
    color: var(--fg); background: transparent;
    border: 1.5px solid var(--border); border-radius: 999px;
    padding: 8px 16px; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .mode.active { background: #fff; color: #111; text-shadow: none; }

  .timer { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #time {
    font-size: clamp(88px, 18vw, 150px); font-weight: 700;
    letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* Progress bar: green "charging" fill with a shimmer while running */
  .track {
    width: min(420px, 78vw); height: 8px; border-radius: 999px;
    background: rgba(255,255,255,0.16);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  .fill {
    position: relative; height: 100%; width: 0; border-radius: inherit; overflow: hidden;
    background: linear-gradient(90deg, var(--green-1), var(--green-2) 65%, var(--green-3));
    box-shadow: 0 0 14px rgba(70, 255, 140, 0.55);
    transition: width .4s linear;
  }
  .fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: translateX(-100%);
  }
  body.running .fill::after { animation: shimmer 1.8s ease-in-out infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }

  .controls { display: flex; align-items: center; gap: 14px; }
  #toggle {
    font: inherit; font-size: 22px; font-weight: 600;
    background: #fff; color: #111; border: 0; border-radius: 999px;
    width: 130px; height: 48px; cursor: pointer;
  }
  .icon {
    background: none; border: 0; color: var(--fg); cursor: pointer;
    width: 42px; height: 42px; display: grid; place-items: center;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  .icon svg { width: 34px; height: 34px; }

  #round { font-size: 15px; opacity: 0.85; }

  /* Corners: clock top-left, weather top-right, small buttons bottom-right */
  .corner { position: fixed; z-index: 2; text-shadow: 0 2px 12px rgba(0,0,0,0.45); line-height: 1.25; }
  #clock { top: 24px; left: 24px; }
  #weather { top: 24px; right: 24px; text-align: right; }
  .corner .big { font-size: 26px; font-weight: 700; }
  .corner .sub { font-size: 13px; opacity: 0.85; }
  #greeting { font-size: 15px; opacity: 0.9; }
  #tools { bottom: 20px; right: 20px; display: flex; gap: 4px; }
  #tools .icon { width: 36px; height: 36px; opacity: 0.85; }
  #tools .icon:hover { opacity: 1; }
  #tools .icon svg { width: 24px; height: 24px; }
  @media (max-width: 600px) {
    #clock { top: 16px; left: 16px; } #weather { top: 16px; right: 16px; }
    .corner .big { font-size: 20px; }
    #tools { bottom: 12px; right: 12px; }
  }

  /* Focus mode: fade everything but the timer, bar and top task */
  .fadeable { transition: opacity .8s ease; }
  body.focus .fadeable { opacity: 0; pointer-events: none; }
  body.focus { cursor: none; }

  /* To-do: top item is the focus, the rest trail off underneath */
  .todos { width: min(460px, calc(100vw - 32px)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #todoList { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .todo-top {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: var(--glass); backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255,255,255,0.35); border-radius: 14px;
    padding: 12px 12px 12px 18px; text-shadow: none;
  }
  .todo-top .text { flex: 1; font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
  .todo-top button {
    flex: none; width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.7); background: transparent; color: #fff;
    font: inherit; font-size: 16px; display: grid; place-items: center;
  }
  .todo-top button.done { background: #fff; color: #111; border-color: #fff; }
  .todo-top button:hover { background: rgba(255,255,255,0.18); }
  .todo-top button.done:hover { background: #e8e8e8; }
  .todo-next { list-style: none; text-align: center; font-size: 14px; }
  .todo-next li { padding: 1px 0; }
  .todo-next li:nth-child(1) { opacity: 0.6; }
  .todo-next li:nth-child(2) { opacity: 0.38; font-size: 13px; }
  .todo-next li:nth-child(3) { opacity: 0.22; font-size: 12px; }
  .todo-more { font-size: 12px; opacity: 0.4; }
  #todoInput {
    width: 100%; font: inherit; font-size: 14px; text-align: center;
    padding: 8px 12px; border-radius: 999px; color: #fff;
    border: 1px dashed rgba(255,255,255,0.4); background: rgba(0,0,0,0.15);
    outline: none;
  }
  #todoInput::placeholder { color: rgba(255,255,255,0.65); }
  #todoInput:focus { border-style: solid; background: var(--glass); }

  /* Dialogs */
  dialog {
    margin: auto; border: 0; border-radius: 16px;
    background: rgba(25, 25, 35, 0.92); color: var(--fg);
    backdrop-filter: blur(12px);
    padding: 24px; width: min(380px, calc(100vw - 32px));
    max-height: calc(100vh - 32px); overflow: auto;
    font-family: inherit;
  }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  dialog h2 { font-size: 18px; margin-bottom: 16px; }
  dialog h3 { font-size: 13px; font-weight: 500; opacity: 0.65; margin: 20px 0 10px; text-transform: lowercase; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .row label { font-size: 15px; }
  .row .inline { display: flex; gap: 8px; align-items: center; }
  .row input[type=number], .row select {
    width: 72px; font: inherit; padding: 6px 8px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff;
  }
  .row select { width: auto; }
  .row select option { background: #22222c; }
  .row input[type=checkbox] { width: 18px; height: 18px; }
  .mini {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #fff;
    border-radius: 999px; padding: 5px 12px;
  }
  .mini:hover { background: rgba(255,255,255,0.12); }
  .hint { font-size: 12px; opacity: 0.55; margin-top: -4px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .actions button {
    font: inherit; font-weight: 600; border-radius: 999px; padding: 8px 18px; cursor: pointer;
    border: 1.5px solid #fff; background: transparent; color: #fff;
  }
  .actions button.primary { background: #fff; color: #111; }

  /* Stats panel */
  #stats { width: min(560px, calc(100vw - 32px)); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 520px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile { background: rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 14px; }
  .tile .k { font-size: 12px; opacity: 0.65; text-transform: lowercase; }
  .tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tile .v small { font-size: 13px; font-weight: 500; opacity: 0.7; }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
  .chart .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .chart .bar { width: 100%; min-height: 2px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,0.75); }
  .chart .col.today .bar { background: linear-gradient(0deg, var(--green-1), var(--green-3)); }
  .chart .col.empty .bar { background: rgba(255,255,255,0.15); }
  .chart .d { font-size: 10px; opacity: 0.6; }

  /* Month calendar heatmap */
  .month-head { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px; }
  .month-head h3 { margin: 0; }
  .month-head .mini { padding: 2px 10px; }
  .month-head .mini:disabled { opacity: 0.25; cursor: default; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { font-size: 10px; opacity: 0.5; text-align: center; }
  .cal i {
    height: 34px; border-radius: 6px; background: rgba(255,255,255,0.08);
    font-style: normal; font-size: 11px; padding: 3px 5px; opacity: 0.95;
  }
  .cal i.blank { background: none; }
  .cal i.future { opacity: 0.35; }
  .cal i.l1 { background: #1d4a30; }
  .cal i.l2 { background: #1f8a47; }
  .cal i.l3 { background: #2fd36a; color: #08200f; }
  .cal i.l4 { background: #c4ff5e; color: #08200f; box-shadow: 0 0 12px rgba(196,255,94,0.45); font-weight: 700; }
  .cal i.today { outline: 1.5px solid rgba(255,255,255,0.8); }
  .legend { display: flex; justify-content: space-between; align-items: center; font-size: 11px; opacity: 0.6; margin-top: 8px; }
  .legend span { display: inline-flex; gap: 2px; align-items: center; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .task-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-bottom: 10px; font-size: 14px; }
  .task-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row .dur { opacity: 0.7; }
  .task-row .tbar { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); }
  .task-row .tbar div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green-1), var(--green-3)); }
  .empty-note { font-size: 13px; opacity: 0.55; }

  /* Final minute of a pomodoro: the bar glows and pulses so the finish feels like a sprint */
  .track { transition: height .4s ease; }
  body.final .track { height: 10px; }
  body.final .fill {
    background: linear-gradient(90deg, var(--green-2), var(--green-3) 70%, #f4ffb0);
    animation: finalPulse 1s ease-in-out infinite;
  }
  body.final .fill::after { animation-duration: .8s; }
  body.final #time { animation: finalGlow 1s ease-in-out infinite; }
  @keyframes finalPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(120,255,150,0.55); filter: brightness(1); }
    50% { box-shadow: 0 0 30px rgba(190,255,120,0.95); filter: brightness(1.3); }
  }
  @keyframes finalGlow {
    0%, 100% { text-shadow: 0 2px 12px rgba(0,0,0,0.35); }
    50% { text-shadow: 0 2px 12px rgba(0,0,0,0.35), 0 0 36px rgba(170,255,130,0.55); }
  }

  /* Stats panel tabs */
  .tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: 18px; border-radius: 999px; background: rgba(255,255,255,0.07); }
  .tab {
    flex: 1; font: inherit; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
    background: none; border: 0; border-radius: 999px; padding: 7px 10px; opacity: 0.7;
  }
  .tab:hover { opacity: 1; }
  .tab.active { background: #fff; color: #111; opacity: 1; }
  .tab small { font-weight: 500; opacity: 0.6; }

  /* Streak at-risk dot on the stats button (evenings only, when today isn't studied yet) */
  #openStats { position: relative; }
  .dot { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: #ff8a3d; box-shadow: 0 0 8px #ff8a3d; }

  /* Streak */
  .streak-hero {
    display: flex; align-items: center; gap: 16px; padding: 14px 18px; margin-bottom: 14px; border-radius: 14px;
    background: linear-gradient(120deg, rgba(255,120,40,0.18), rgba(255,200,60,0.06));
    border: 1px solid rgba(255,150,60,0.25);
  }
  .streak-hero.cold { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
  .streak-hero .flame { line-height: 1; filter: drop-shadow(0 0 12px rgba(255,140,40,0.6)); }
  .streak-hero.cold .flame { filter: grayscale(1); opacity: 0.4; }
  .streak-hero .sv { font-size: 22px; font-weight: 700; }
  .streak-hero .ss { font-size: 13px; opacity: 0.75; }
  .week-dots { display: flex; gap: 6px; margin-top: 8px; }
  .week-dots span { width: 22px; text-align: center; font-size: 10px; color: rgba(255,255,255,0.6); }
  .week-dots i { display: block; width: 14px; height: 14px; margin: 0 auto 3px; border-radius: 50%; background: rgba(255,255,255,0.12); }
  .week-dots i.on { background: linear-gradient(135deg, #ffb347, #ff6a2b); box-shadow: 0 0 8px rgba(255,120,40,0.6); }

  /* Trophies */
  .tier-bronze { --tier: #d08a4f; }
  .tier-silver { --tier: #cfd6df; }
  .tier-gold { --tier: #f5c84c; }
  .tier-platinum { --tier: #a9d6ff; }
  .trophy-head { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
  .ring {
    width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: conic-gradient(var(--green-3) calc(var(--pct) * 1%), rgba(255,255,255,0.1) 0);
  }
  .ring span { width: 62px; height: 62px; border-radius: 50%; background: #1d1d27; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .trophy-head .big { font-size: 20px; font-weight: 700; }
  .tier-counts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 13px; }
  .tier-counts b { color: var(--tier); }
  .trophy { display: flex; align-items: center; gap: 14px; padding: 10px 12px; margin-bottom: 8px; border-radius: 12px; background: rgba(255,255,255,0.05); }
  .t-icon {
    width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 22px;
    border: 2px solid var(--tier);
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.03));
    box-shadow: 0 0 14px color-mix(in srgb, var(--tier) 45%, transparent);
  }
  .trophy.locked .t-icon { border-color: rgba(255,255,255,0.15); box-shadow: none; filter: grayscale(1); opacity: 0.45; }
  .t-main { flex: 1; min-width: 0; }
  .t-name { font-weight: 700; font-size: 15px; }
  .trophy.locked .t-name { opacity: 0.7; }
  .t-desc { font-size: 12.5px; opacity: 0.65; }
  .t-prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; opacity: 0.8; }
  .t-prog div { flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.1); }
  .t-prog div i { display: block; height: 100%; border-radius: inherit; background: var(--tier); }
  .t-side { text-align: right; font-size: 11px; flex: none; }
  .t-tier { color: var(--tier); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .t-date { display: block; opacity: 0.55; margin-top: 2px; }

  /* Trophy unlock pop-up */
  .trophy-toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 60;
    display: flex; align-items: center; gap: 14px; padding: 10px 24px 10px 10px; border-radius: 999px; cursor: pointer;
    background: rgba(18,18,26,0.92); backdrop-filter: blur(12px); text-shadow: none;
    border: 1px solid color-mix(in srgb, var(--tier) 55%, transparent);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 24px color-mix(in srgb, var(--tier) 30%, transparent);
  }
  .trophy-toast .t-icon { width: 44px; height: 44px; }
  .trophy-toast .tt-k { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
  .trophy-toast .tt-name { font-size: 16px; font-weight: 700; white-space: nowrap; }

  /* Wrapped */
  .wrap-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .wrap-nav .mini { padding: 2px 10px; }
  .wrap-nav .mini:disabled { opacity: 0.25; cursor: default; }
  .wrapped {
    position: relative; overflow: hidden; border-radius: 18px; padding: 24px;
    background:
      radial-gradient(circle at 85% 10%, rgba(196,255,94,0.35), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(47,211,106,0.35), transparent 50%),
      linear-gradient(150deg, #0f2a1b, #0b1510 60%, #151a0c);
    border: 1px solid rgba(196,255,94,0.25);
  }
  .wrapped .w-label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
  .wrapped .w-big {
    font-size: 54px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin-top: 6px;
    background: linear-gradient(90deg, #fff, var(--green-3)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .wrapped .w-vibe { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .wrapped .w-cmp { font-size: 13px; margin-top: 6px; opacity: 0.85; }
  .w-bars { display: flex; align-items: flex-end; gap: 6px; height: 70px; margin-top: 18px; }
  .w-bars .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 10px; }
  .w-bars .bar { width: 100%; min-height: 3px; border-radius: 4px; background: linear-gradient(0deg, var(--green-1), var(--green-3)); }
  .w-bars .col.empty .bar { background: rgba(255,255,255,0.12); }
  .w-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .w-grid > div { background: rgba(0,0,0,0.25); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .w-grid .k { font-size: 11px; opacity: 0.65; }
  .w-grid .v { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w-trophies { margin-top: 16px; font-size: 13px; }

  /* Goal celebration */
  .money { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
  .money span { position: absolute; top: 0; will-change: transform; }
  .goal-banner {
    position: fixed; left: 50%; top: 18%; z-index: 51; pointer-events: none;
    transform: translateX(-50%);
    font-size: clamp(26px, 5vw, 44px); font-weight: 700; white-space: nowrap;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 30px rgba(120,255,150,0.5);
  }
</style>
</head>
<body>
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="shade"></div>

  <main>
    <div class="modes fadeable">
      <button class="mode active" data-mode="pomodoro">pomodoro</button>
      <button class="mode" data-mode="short">short break</button>
      <button class="mode" data-mode="long">long break</button>
    </div>
    <div class="timer">
      <div id="time">25:00</div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="controls fadeable">
      <button id="toggle">start</button>
      <button class="icon" id="reset" title="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="icon" id="openStats" title="Stats, trophies, wrapped">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 20v-6M12 20V5M19 20v-10"/></svg>
        <span class="dot" id="statsDot" title="Study today to keep your streak" hidden></span>
      </button>
      <button class="icon" id="openSettings" title="Settings">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.5 7.5 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </div>
    <div id="round" class="fadeable"></div>
    <div class="todos">
      <div id="todoList"></div>
      <input id="todoInput" class="fadeable" maxlength="200" placeholder="+ add a task (enter)" autocomplete="off">
    </div>
  </main>

  <div id="clock" class="corner fadeable"><div class="big" id="clockTime"></div><div id="greeting"></div></div>
  <div id="weather" class="corner fadeable"></div>
  <div id="tools" class="corner fadeable">
    <button class="icon" id="nextWall" title="Next wallpaper (N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
    </button>
    <button class="icon" id="fullscreen" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path id="fsPath" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <dialog id="stats">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="stats">stats</button>
      <button type="button" class="tab" data-tab="trophies">trophies <small id="trophyCount"></small></button>
      <button type="button" class="tab" data-tab="wrapped">wrapped</button>
    </div>
    <div id="statsBody"></div>
    <div class="actions"><button type="button" class="primary" id="closeStats">close</button></div>
  </dialog>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <div class="row"><label for="sPomo">Pomodoro (min)</label><input type="number" id="sPomo" min="1" max="180"></div>
      <div class="row"><label for="sShort">Short break (min)</label><input type="number" id="sShort" min="1" max="60"></div>
      <div class="row"><label for="sLong">Long break (min)</label><input type="number" id="sLong" min="1" max="120"></div>
      <div class="row"><label for="sEvery">Long break every</label><input type="number" id="sEvery" min="1" max="12"></div>
      <div class="row"><label for="sAuto">Auto-start next session</label><input type="checkbox" id="sAuto"></div>
      <div class="row">
        <label for="sGoal">Daily goal (pomodoros)</label>
        <span class="inline"><button type="button" class="mini" id="testGoal" title="Preview the celebration">💸</button><input type="number" id="sGoal" min="1" max="30"></span>
      </div>
      <div class="row"><label for="sFocus">Focus mode while running</label><input type="checkbox" id="sFocus"></div>
      <div class="row">
        <label for="sChime">Chime</label>
        <span class="inline">
          <button type="button" class="mini" id="previewChime" title="Preview">▶</button>
          <select id="sChime">
            <option value="bells">bells</option>
            <option value="soft">soft</option>
            <option value="digital">digital</option>
            <option value="gong">gong</option>
            <option value="kaching">ka-ching</option>
            <option value="none">none</option>
          </select>
        </span>
      </div>

      <h3>Backup</h3>
      <div class="row">
        <span class="inline">
          <button type="button" class="mini" id="exportData">export</button>
          <button type="button" class="mini" id="importData">import</button>
        </span>
      </div>
      <p class="hint">Saves your stats, tasks and settings to a file. Import replaces what's here.</p>
      <input type="file" id="importFile" accept="application/json,.json" hidden>

      <div class="actions">
        <button type="button" id="cancelSettings">cancel</button>
        <button type="submit" class="primary">save</button>
      </div>
    </form>
  </dialog>

<script>
  // Folder name has three spaces in it, so it's URL-encoded here.
  const WALLPAPER_DIR = 'Pomodoro%20%20%20wallpapers/';
  const WALLPAPERS = [
    'wallhaven-d8vvlo_3840x2160.png',
    'wallhaven-213wqy_1920x1080.png',
    'the-batman-shadows-of-the-future-b1.jpg',
    'Glass gradients.jpg',
    'macos-mojave-sand-dunes-mojave-desert-california-night-dark-3840x2160-4051.jpg',
    'snow-mountains-3840x2160-26362.jpg',
    '656727456_18043513514572653_7657317636639458823_n.jpg',
    'Torontoview.jpg',
    'ios-13-stock-ipados-red-black-background-amoled-ipad-hd-3840x2160-792.jpg',
    'AirBNBView.jpg',
    'u2265181388_imagine_an_OLED_wallpaper_complete_black_background_cc717434-c290-4a63-bae7-c4da85c48418.jpg',
  ];

  const DEFAULTS = {
    pomodoro: 25, short: 5, long: 15, every: 4, auto: true,
    goal: 4, focus: true, chime: 'bells',
  };

  const GREETINGS = {
    pomodoro: 'time to lock in boss',
    goalDone: 'goal hit. bonus round, boss',
    short: 'breathe, boss',
    long: 'long break. you earned it boss',
  };

  const load = (k, fallback) => {
    try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  // Ask the browser not to evict this site's storage on its own
  try { navigator.storage?.persist?.(); } catch {}

  let settings = { ...DEFAULTS, ...load('pomo.settings', {}) };
  let wallIndex = load('pomo.wall', 0) % WALLPAPERS.length;
  let mode = 'pomodoro';
  let completedPomos = 0;
  let remaining = settings.pomodoro * 60;
  let endAt = null;      // timestamp when running; null when paused
  let tick = null;

  const $ = id => document.getElementById(id);
  const timeEl = $('time'), toggleBtn = $('toggle'), roundEl = $('round');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- Study tracking (saved in this browser's localStorage) ----
  // stats = { 'YYYY-MM-DD': { s: focused seconds, p: pomodoros, c: tasks completed, g: goal celebrated, t: { task: seconds } } }
  let stats = load('pomo.stats', {});
  let trophies = load('pomo.trophies', {});        // { trophyId: unlocked timestamp }
  let meta = load('pomo.meta', { bestCombo: 0 });  // records that aren't per-day
  let lastCredit = 0;
  let combo = 0;  // pomodoros finished in a row without pausing or resetting

  const dayKey = (d = new Date()) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const bumpDay = () => (stats[dayKey()] ||= { s: 0, p: 0 });
  const getDay = d => stats[dayKey(d)] || { s: 0, p: 0 };
  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const keyDate = k => new Date(k + 'T00:00');

  // Under 5 minutes doesn't count as a study day (stray start/pause clicks)
  const MIN_DAY_SEC = 300;

  // Consecutive study days counting back from today (today not studied yet doesn't break it)
  function currentStreak() {
    let n = 0;
    for (let i = getDay(new Date()).s >= MIN_DAY_SEC ? 0 : 1; getDay(daysAgo(i)).s >= MIN_DAY_SEC; i++) n++;
    return n;
  }

  function daysSinceLastStudy() {
    const today = dayKey();
    const prev = Object.keys(stats).filter(k => k < today && stats[k].s >= MIN_DAY_SEC).sort().pop();
    return prev ? Math.round((keyDate(today) - keyDate(prev)) / 864e5) : 0;
  }

  function fmtDur(sec) {
    const m = Math.floor(sec / 60), h = Math.floor(m / 60);
    return h ? `${h}h ${m % 60}m` : `${m}m`;
  }

  // Only time actually spent running in pomodoro mode counts.
  // It's also credited to whatever task is on top of the list.
  function creditFocus() {
    if (!endAt || mode !== 'pomodoro') return;
    const now = Math.min(Date.now(), endAt);
    const sec = (now - lastCredit) / 1000;
    lastCredit = now;
    if (sec <= 0) return;
    const d = bumpDay();
    d.s += sec;
    if (todos[0]) {
      d.t ||= {};
      d.t[todos[0]] = (d.t[todos[0]] || 0) + sec;
    }
    save('pomo.stats', stats);
  }

  // ---- Wallpapers ----
  const layers = [$('bgA'), $('bgB')];
  let front = 0;
  const wallUrl = i => WALLPAPER_DIR + encodeURIComponent(WALLPAPERS[i]);

  function showWallpaper(i) {
    const img = new Image();
    img.onload = () => {
      const next = layers[1 - front];
      next.style.backgroundImage = `url("${img.src}")`;
      next.classList.add('show');
      layers[front].classList.remove('show');
      front = 1 - front;
      // Warm the cache for the following one
      new Image().src = wallUrl((i + 1) % WALLPAPERS.length);
    };
    img.src = wallUrl(i);
  }

  function nextWallpaper() {
    wallIndex = (wallIndex + 1) % WALLPAPERS.length;
    save('pomo.wall', wallIndex);
    showWallpaper(wallIndex);
  }

  // ---- Timer ----
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const LABELS = { pomodoro: 'focus', short: 'short break', long: 'long break' };

  function render() {
    timeEl.textContent = fmt(remaining);
    document.title = `${fmt(remaining)} · ${LABELS[mode]}`;
    toggleBtn.textContent = endAt ? 'pause' : 'start';
    document.body.classList.toggle('running', !!endAt);

    const total = settings[mode] * 60;
    const left = endAt ? Math.max(0, (endAt - Date.now()) / 1000) : remaining;
    $('fill').style.width = `${Math.min(1, Math.max(0, 1 - left / total)) * 100}%`;
    document.body.classList.toggle('final', !!endAt && mode === 'pomodoro' && left <= 60);

    const today = getDay(new Date());
    roundEl.textContent = `${today.p} / ${settings.goal} today · ${fmtDur(today.s)} focused`;

    $('greeting').textContent = mode !== 'pomodoro' ? GREETINGS[mode]
      : today.p >= settings.goal ? GREETINGS.goalDone : GREETINGS.pomodoro;

    document.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }

  function setMode(m, { autostart = false } = {}) {
    const changed = m !== mode;
    stop();
    mode = m;
    remaining = settings[m] * 60;
    if (changed) nextWallpaper();
    if (autostart) start();
    render();
  }

  function start() {
    if (endAt) return;
    endAt = Date.now() + remaining * 1000;
    lastCredit = Date.now();
    tick = setInterval(update, 250);
    wake();
    render();
  }

  function stop() {
    if (!endAt) return;
    creditFocus();
    combo = 0;
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    endAt = null;
    clearInterval(tick);
    wake();
    render();
  }

  function update() {
    creditFocus();
    remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    if (remaining === 0) return finish();
    render();
  }

  function finish() {
    endAt = null;
    clearInterval(tick);
    let next, celebrateNow = false;
    const wasPomo = mode === 'pomodoro';
    if (wasPomo) {
      completedPomos++;
      combo++;
      if (combo > (meta.bestCombo || 0)) { meta.bestCombo = combo; save('pomo.meta', meta); }
      const d = bumpDay();
      d.p++;
      if (d.p >= settings.goal && !d.g) { d.g = true; celebrateNow = true; }
      save('pomo.stats', stats);
      next = completedPomos % settings.every === 0 ? 'long' : 'short';
    } else {
      next = 'pomodoro';
    }
    celebrateNow ? celebrate() : chime();
    notify(celebrateNow ? 'Daily goal hit. Paid in full.'
      : next === 'pomodoro' ? 'Break over — back to it.' : 'Pomodoro done — take a break.');
    setMode(next, { autostart: settings.auto });
    if (wasPomo) checkTrophies({ event: 'pomo', hour: new Date().getHours(), gap: daysSinceLastStudy() });
  }

  // ---- Focus mode: fade the extras a few seconds after the mouse goes still ----
  let idleTimer;
  function wake() {
    document.body.classList.remove('focus');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const busy = document.querySelector('dialog[open]') || document.activeElement === $('todoInput');
      if (endAt && settings.focus && !busy) document.body.classList.add('focus');
    }, 3000);
  }
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach(ev =>
    document.addEventListener(ev, wake, { passive: true }));

  // ---- Clock ----
  function renderClock() {
    $('clockTime').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  // ---- Fullscreen ----
  const FS_ENTER = 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5';
  const FS_EXIT = 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
  document.addEventListener('fullscreenchange', () =>
    $('fsPath').setAttribute('d', document.fullscreenElement ? FS_EXIT : FS_ENTER));

  // ---- Stats panel ----
  function renderStats() {
    const today = getDay(new Date());
    let week = 0, weekP = 0;
    for (let i = 0; i < 7; i++) { week += getDay(daysAgo(i)).s; weekP += getDay(daysAgo(i)).p; }

    const all = Object.values(stats);
    const total = all.reduce((a, d) => a + d.s, 0);
    const totalP = all.reduce((a, d) => a + d.p, 0);
    const totalC = all.reduce((a, d) => a + (d.c || 0), 0);
    const best = Object.entries(stats).sort((a, b) => b[1].s - a[1].s)[0];
    const dateLabel = (d, opts) => d.toLocaleDateString(undefined, opts);

    // Streak: the flame grows with it; dots show the last 7 days
    const streak = currentStreak();
    const studiedToday = today.s >= MIN_DAY_SEC;
    const streakNote = studiedToday ? "today's locked in ✓" : streak ? 'study today to keep it alive' : 'one session starts a new streak';
    const dots = Array.from({ length: 7 }, (_, i) => daysAgo(6 - i)).map(d =>
      `<span><i class="${getDay(d).s >= MIN_DAY_SEC ? 'on' : ''}"></i>${dateLabel(d, { weekday: 'short' })[0]}</span>`).join('');
    const streakHtml = `
      <div class="streak-hero ${streak ? '' : 'cold'}">
        <div class="flame" style="font-size:${34 + Math.min(streak, 30) * 1.4}px">🔥</div>
        <div>
          <div class="sv">${streak} day streak</div>
          <div class="ss">${streakNote} · best ${trophyStats().bestStreak}</div>
          <div class="week-dots">${dots}</div>
        </div>
      </div>`;

    // Last 14 days bar chart
    const days = Array.from({ length: 14 }, (_, i) => daysAgo(13 - i));
    const max = Math.max(1, ...days.map(d => getDay(d).s));
    const bars = days.map((d, i) => {
      const { s, p } = getDay(d);
      const cls = i === 13 ? 'today' : s ? '' : 'empty';
      return `<div class="col ${cls}" title="${dateLabel(d, { weekday: 'short', month: 'short', day: 'numeric' })}: ${fmtDur(s)}, ${p} pomodoros">
        <div class="bar" style="height:${(s / max) * 100}%"></div><span class="d">${dateLabel(d, { weekday: 'short' })[0]}</span></div>`;
    }).join('');

    // Month calendar heatmap (Sun–Sat rows) for the month being viewed
    const now = new Date();
    const y = statsMonth.getFullYear(), m = statsMonth.getMonth();
    const isCurrentMonth = y === now.getFullYear() && m === now.getMonth();
    // Shade by progress toward the daily goal; hitting the goal is the brightest
    const goalSec = settings.goal * settings.pomodoro * 60;
    const level = (s, p) => {
      if (s < MIN_DAY_SEC) return '';
      const f = Math.max(p / settings.goal, s / goalSec);
      return f >= 1 ? 'l4' : f >= 0.5 ? 'l3' : f >= 0.25 ? 'l2' : 'l1';
    };
    const todayKey = dayKey();
    let cal = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<span class="dow">${d}</span>`).join('');
    cal += '<i class="blank"></i>'.repeat(new Date(y, m, 1).getDay());
    let monthTotal = 0, monthP = 0, monthDays = 0;
    const tasks = {};
    for (let day = 1; day <= new Date(y, m + 1, 0).getDate(); day++) {
      const d = new Date(y, m, day);
      const k = dayKey(d);
      const { s, p, t } = getDay(d);
      monthTotal += s; monthP += p; if (s >= MIN_DAY_SEC) monthDays++;
      for (const [name, sec] of Object.entries(t || {})) tasks[name] = (tasks[name] || 0) + sec;
      const cls = [level(s, p), k === todayKey ? 'today' : '', k > todayKey ? 'future' : ''].join(' ').trim();
      cal += `<i class="${cls}" title="${dateLabel(d, { weekday: 'short', month: 'short', day: 'numeric' })}: ${fmtDur(s)}, ${p} pomodoros">${day}</i>`;
    }
    const monthName = dateLabel(statsMonth, { month: 'long', year: y === now.getFullYear() ? undefined : 'numeric' });

    // Time per task, for the month being viewed
    const topTasks = Object.entries(tasks).filter(([, s]) => s >= 60).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const taskMax = topTasks[0]?.[1] || 1;
    const taskHtml = topTasks.length
      ? topTasks.map(([name, s]) => `<div class="task-row"><span class="name" title="${esc(name)}">${esc(name)}</span><span class="dur">${fmtDur(s)}</span>
          <div class="tbar"><div style="width:${(s / taskMax) * 100}%"></div></div></div>`).join('')
      : '<p class="empty-note">Whatever task is on top of your list while you focus gets the time.</p>';

    $('statsBody').innerHTML = `
      ${streakHtml}
      <div class="tiles">
        <div class="tile"><div class="k">today</div><div class="v">${fmtDur(today.s)} <small>${today.p}/${settings.goal}</small></div></div>
        <div class="tile"><div class="k">last 7 days</div><div class="v">${fmtDur(week)} <small>${weekP} pomo</small></div></div>
        <div class="tile"><div class="k">tasks done</div><div class="v">${today.c || 0} <small>today · ${totalC} total</small></div></div>
        <div class="tile"><div class="k">daily avg (7d)</div><div class="v">${fmtDur(week / 7)}</div></div>
        <div class="tile"><div class="k">best day</div><div class="v">${best ? fmtDur(best[1].s) : '—'} <small>${best ? dateLabel(new Date(best[0] + 'T00:00'), { month: 'short', day: 'numeric' }) : ''}</small></div></div>
        <div class="tile"><div class="k">all time</div><div class="v">${fmtDur(total)} <small>${totalP} pomo</small></div></div>
      </div>
      <h3>last 14 days</h3>
      <div class="chart">${bars}</div>
      <div class="month-head">
        <button type="button" class="mini" data-month="-1" title="Previous month">‹</button>
        <h3>${monthName} · ${fmtDur(monthTotal)} · ${monthP} pomo · ${monthDays} day${monthDays === 1 ? '' : 's'}</h3>
        <button type="button" class="mini" data-month="1" title="Next month" ${isCurrentMonth ? 'disabled' : ''}>›</button>
      </div>
      <div class="cal">${cal}</div>
      <div class="legend"><span>% of daily goal: &lt;25 · &lt;50 · &lt;100 · goal hit</span>
        <span>less <i style="background:rgba(255,255,255,0.08)"></i><i style="background:#1d4a30"></i><i style="background:#1f8a47"></i><i style="background:#2fd36a"></i><i style="background:#c4ff5e"></i> more</span></div>
      <h3>top tasks in ${dateLabel(statsMonth, { month: 'long' })}</h3>
      ${taskHtml}`;
  }

  // ---- Wrapped: a recap card for one Mon–Sun week (opens on last week) ----
  const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };

  function renderWrapped() {
    const thisWeek = weekStart(new Date());
    const start = wrapWeek, end = addDays(start, 6);
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    const sum = ds => ds.reduce((acc, d) => {
      const x = getDay(d);
      acc.s += x.s; acc.p += x.p; acc.c += x.c || 0;
      if (x.s >= MIN_DAY_SEC) acc.days++;
      if (x.g || x.p >= settings.goal) acc.goals++;
      return acc;
    }, { s: 0, p: 0, c: 0, days: 0, goals: 0 });
    const w = sum(days), prev = sum(days.map(d => addDays(d, -7)));

    const best = days.reduce((b, d) => getDay(d).s > getDay(b).s ? d : b, days[0]);
    const tasks = {};
    days.forEach(d => Object.entries(getDay(d).t || {}).forEach(([n, s]) => tasks[n] = (tasks[n] || 0) + s));
    const top = Object.entries(tasks).sort((a, b) => b[1] - a[1])[0];
    const earned = TROPHIES.filter(t => trophies[t.id] >= start.getTime() && trophies[t.id] < addDays(end, 1).getTime());

    const hrs = w.s / 3600;
    const vibe = hrs >= 25 ? 'Absolute machine.' : hrs >= 15 ? 'Elite week, boss.' : hrs >= 8 ? 'Solid grind.'
      : hrs >= 3 ? 'Building momentum.' : w.s >= MIN_DAY_SEC ? "It's a start." : 'Rest week. Run it back.';
    const diff = w.s - prev.s;
    const cmp = prev.s < MIN_DAY_SEC ? (w.s >= MIN_DAY_SEC ? 'first week on the books' : '')
      : `${diff >= 0 ? '▲' : '▼'} ${fmtDur(Math.abs(diff))} vs the week before`;

    const fmtD = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const isThis = start.getTime() === thisWeek.getTime();
    const label = isThis ? 'this week so far' : start.getTime() === addDays(thisWeek, -7).getTime() ? 'last week' : 'week of';

  // ---- Sounds ----
  let audioCtx;
  function tone(freq, at, dur, { type = 'sine', vol = 0.3, attack = 0.02 } = {}) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    const t = audioCtx.currentTime + at;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }

  const CHIMES = {
    bells: () => [660, 880, 990].forEach((f, i) => tone(f, i * 0.25, 0.6)),
    soft: () => { tone(523, 0, 1.2, { type: 'triangle', vol: 0.22, attack: 0.08 }); tone(784, 0.35, 1.4, { type: 'triangle', vol: 0.18, attack: 0.08 }); },
    digital: () => [0, 0.16, 0.32, 0.7, 0.86, 1.02].forEach(t => tone(1100, t, 0.09, { type: 'square', vol: 0.08, attack: 0.005 })),
    gong: () => { tone(110, 0, 3.5, { vol: 0.35, attack: 0.01 }); tone(222, 0, 2.5, { vol: 0.15, attack: 0.01 }); tone(331, 0, 1.8, { vol: 0.08, attack: 0.01 }); },
    kaching: () => {
      tone(1568, 0, 0.12, { type: 'triangle', vol: 0.18, attack: 0.005 });
      tone(2093, 0.08, 0.15, { type: 'triangle', vol: 0.18, attack: 0.005 });
      tone(2637, 0.16, 1.0, { vol: 0.2, attack: 0.005 });
      tone(3136, 0.16, 0.8, { vol: 0.1, attack: 0.005 });
    },
    none: () => {},
  };

  function chime(name = settings.chime) {
    try {

    } catch {}
  }

  // Everything the trophies measure, computed from the saved stats
  function trophyStats() {
    const entries = Object.entries(stats);
    const studied = entries.filter(([, d]) => d.s >= MIN_DAY_SEC).map(([k]) => k).sort();
    const a = {
      s: 0, p: 0, c: 0, maxP: 0, goalDays: 0, bestStreak: 0, best7: 0, bestMonth: 0, weekend: false,
      bestCombo: meta.bestCombo || 0, todayP: getDay(new Date()).p,
    };
    const months = {};
    for (const [k, d] of entries) {
      a.s += d.s; a.p += d.p; a.c += d.c || 0;
      a.maxP = Math.max(a.maxP, d.p);
      if (d.g || d.p >= settings.goal) a.goalDays++;
      months[k.slice(0, 7)] = (months[k.slice(0, 7)] || 0) + d.s;
    }
    a.s /= 3600;
    a.bestMonth = Math.max(0, ...Object.values(months)) / 3600;
    let run = 0, prev = null;
    for (const k of studied) {
      run = prev && dayKey(addDays(keyDate(prev), 1)) === k ? run + 1 : 1;
      a.bestStreak = Math.max(a.bestStreak, run);
      prev = k;
      const d = keyDate(k);
      let week = 0;
      for (let i = 0; i < 7; i++) week += getDay(addDays(d, -i)).s;
      a.best7 = Math.max(a.best7, week / 3600);
      if (d.getDay() === 6 && getDay(addDays(d, 1)).s >= MIN_DAY_SEC) a.weekend = true;
    }
    return a;
  }

  function checkTrophies(ctx = {}) {
    const a = trophyStats();
    const fresh = [];
    for (const t of TROPHIES) {
      if (trophies[t.id]) continue;
      const ok = t.prog ? (([cur, target]) => cur >= target)(t.prog(a)) : t.test(a, ctx);
      if (!ok) continue;
      trophies[t.id] = Date.now();
      fresh.push(t);
    }
    if (!fresh.length) return;
    save('pomo.trophies', trophies);
    // Catching up on a backlog (e.g. first load with old stats) gets one pop-up, not a flood
    if (fresh.length > 3) trophyToast({ tier: 'gold', icon: '🏆', name: `${fresh.length} trophies unlocked`, kicker: 'catching up' });
    else fresh.forEach(trophyToast);
  }

  const toastQueue = [];
  let toastBusy = false;
  function trophyToast(t) {
    toastQueue.push(t);
    if (!toastBusy) nextToast();
  }
  function nextToast() {
    const t = toastQueue.shift();
    if (!t) { toastBusy = false; return; }
    toastBusy = true;
    trophySound(t.tier);
    const el = document.createElement('div');
    el.className = `trophy-toast tier-${t.tier}`;
    el.title = 'See your trophies';
    el.innerHTML = `<div class="t-icon">${t.icon}</div>
      <div><div class="tt-k">${t.kicker || 'trophy unlocked'} · ${t.tier}</div><div class="tt-name">${esc(t.name)}</div></div>`;
    el.onclick = () => openStats('trophies');
    document.body.append(el);
    el.animate([
      { opacity: 0, transform: 'translate(-50%, 140%)' },
      { opacity: 1, transform: 'translate(-50%, 0)', offset: 0.08 },
      { opacity: 1, transform: 'translate(-50%, 0)', offset: 0.9 },
      { opacity: 0, transform: 'translate(-50%, 140%)' },
    ], { duration: 5000, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }).onfinish = () => { el.remove(); nextToast(); };
  }

  function trophySound(tier) {
    try {
      audioCtx ||= new AudioContext();
      const notes = tier === 'platinum' ? [784, 988, 1175, 1568] : tier === 'gold' ? [880, 1175, 1568] : [988, 1319];
      notes.forEach((f, i) => tone(f, i * 0.09, 0.5, { type: 'triangle', vol: 0.16, attack: 0.005 }));
    } catch {}
  }

  function renderTrophies() {
    const a = trophyStats();
    const progOf = t => { if (!t.prog) return 0; const [c, g] = t.prog(a); return Math.min(1, c / g); };
    // Unlocked newest first, then locked closest-to-done first, hidden ones last
    const got = TROPHIES.filter(t => trophies[t.id]).sort((x, y) => trophies[y.id] - trophies[x.id]);
    const locked = TROPHIES.filter(t => !trophies[t.id]).sort((x, y) => (!!x.hidden - !!y.hidden) || progOf(y) - progOf(x));
    const pct = Math.round(got.length / TROPHIES.length * 100);
    const counts = TIERS.map(tier =>
      `<span class="tier-${tier}"><b>●</b> ${got.filter(t => t.tier === tier).length}/${TROPHIES.filter(t => t.tier === tier).length} ${tier}</span>`).join('');

    const row = t => {
      const have = trophies[t.id];
      const secret = !have && t.hidden;
      let prog = '';
      if (!have && t.prog) {
        const [c, g] = t.prog(a);
        const txt = t.unit === 'h' ? `${Math.min(c, g).toFixed(1)}h / ${g}h` : `${Math.min(Math.floor(c), g)} / ${g}`;
        prog = `<div class="t-prog"><div><i style="width:${progOf(t) * 100}%"></i></div>${txt}</div>`;
      }
      return `<div class="trophy tier-${t.tier} ${have ? 'got' : 'locked'}">
        <div class="t-icon">${secret ? '?' : t.icon}</div>
        <div class="t-main">
          <div class="t-name">${secret ? 'Hidden trophy' : t.name}</div>
          <div class="t-desc">${secret ? 'Keep locking in to reveal it' : t.desc}</div>
          ${prog}
        </div>
        <div class="t-side"><span class="t-tier">${t.tier}</span>${have ? `<span class="t-date">${new Date(have).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>` : ''}</div>
      </div>`;
    };

    $('statsBody').innerHTML = `
      <div class="trophy-head">
        <div class="ring" style="--pct:${pct}"><span>${pct}%</span></div>
        <div><div class="big">${got.length} of ${TROPHIES.length} trophies</div><div class="tier-counts">${counts}</div></div>
      </div>
      ${[...got, ...locked].map(row).join('')}`;
  }

        <button data-act="done" class="done" title="Done">✓</button>
      </div>
      ${shown.length ? `<ul class="todo-next fadeable">${shown.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${rest.length > 3 ? `<div class="todo-more fadeable">+${rest.length - 3} more</div>` : ''}`;
  }

  $('todoList').addEventListener('click', e => {
    const act = e.target.closest('button')?.dataset.act;
    if (!act) return;
    creditFocus(); // give the outgoing top task its time before the list changes
    const top = todos.shift();
    if (act === 'skip') todos.push(top);
    if (act === 'done') {
      chime();
      const d = bumpDay();
      d.c = (d.c || 0) + 1;
      save('pomo.stats', stats);
    }
    save('pomo.todos', todos);
    renderTodos();
    if (act === 'done') checkTrophies({ event: 'task' });
  });

  $('todoInput').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const text = e.target.value.trim();
    if (!text) return;
    creditFocus();
    todos.push(text);
    save('pomo.todos', todos);
    e.target.value = '';
    renderTodos();
  });

  // ---- Wire up ----
  document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  toggleBtn.onclick = () => {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    endAt ? stop() : start();
  };
  $('reset').onclick = () => { stop(); remaining = settings[mode] * 60; render(); };
  $('nextWall').onclick = nextWallpaper;
  $('fullscreen').onclick = toggleFullscreen;
  // Stats panel: three tabs, each panel renders into #statsBody
  const statsDlg = $('stats');
  let statsTab = 'stats';
  function renderPanel() {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === statsTab));
    $('trophyCount').textContent = `${TROPHIES.filter(t => trophies[t.id]).length}/${TROPHIES.length}`;
    ({ stats: renderStats, trophies: renderTrophies, wrapped: renderWrapped })[statsTab]();
  }
  function openStats(tab = 'stats') {
    creditFocus();
    statsTab = tab;
    statsMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    wrapWeek = addDays(weekStart(new Date()), -7);
    renderPanel();
    if (!statsDlg.open) statsDlg.showModal();
    statsDlg.scrollTop = 0;
  }
  document.querySelector('.tabs').addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]')?.dataset.tab;
    if (!tab || tab === statsTab) return;
    statsTab = tab;
    renderPanel();
    statsDlg.scrollTop = 0;
  });
  $('openStats').onclick = () => openStats();
  $('closeStats').onclick = () => statsDlg.close();

  document.addEventListener('keydown', e => {
    if (document.querySelector('dialog[open]') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); toggleBtn.click(); }
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'n' || e.key === 'N') nextWallpaper();
  });
  // Stop a focused button from also "clicking" on space after the shortcut above handled it
  document.addEventListener('keyup', e => {
    if (e.code === 'Space' && e.target.tagName === 'BUTTON' && !document.querySelector('dialog[open]')) e.preventDefault();
  });

  remaining = settings.pomodoro * 60;
  showWallpaper(wallIndex);
  renderTodos();
  render();
  renderClock();
  setInterval(renderClock, 1000);
  updateStatsDot();
  setInterval(updateStatsDot, 60 * 1000);
  checkTrophies({ event: 'load' }); // unlocks anything existing stats already earned
  loadWeather();
  setInterval(loadWeather, 20 * 60 * 1000);
</script>
</body>
</html>
